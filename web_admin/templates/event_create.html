{% extends "base.html" %}

{% block title %}
Новое мероприятие — Молодёжь Казани
{% endblock %}


{% block content %}

<a
    href="/events"
    class="back-link"
>
    ← К мероприятиям
</a>


<div class="page-header">

    <div>
        <h1>
            Новое мероприятие
        </h1>

        <p class="subtitle">
            Заполните информацию о мероприятии
        </p>
    </div>

</div>


<div class="event-create-card">

<form
    method="post"
    action="/events/new"
    class="event-form"
>


    <div class="form-field">

        <label>
            Название *
        </label>

        <input
            type="text"
            name="title"
            required
        >

    </div>


    <div class="form-field">

        <label>
            Описание
        </label>

        <textarea
            name="description"
            rows="6"
        ></textarea>

    </div>


    <div class="form-field event-multi-day-toggle">
        <label class="mailing-checkbox">
            <input
                type="checkbox"
                name="is_multi_day"
                id="eventMultiDay"
                value="true"
            >
            <span>Мероприятие длится несколько дней</span>
        </label>
    </div>

    <div class="form-row">

        <div class="form-field">

            <label>
                Дата начала *
            </label>

            <input
                type="date"
                name="event_date"
                id="eventStartDate"
                required
            >

        </div>


        <div class="form-field event-end-date-field" id="eventEndDateField" hidden>

            <label>
                Дата завершения *
            </label>

            <input
                type="date"
                name="end_date"
                id="eventEndDate"
                disabled
            >

        </div>


        <div class="form-field">

            <label>
                Время *
            </label>

            <input
                type="time"
                name="start_time"
                required
            >

        </div>

    </div>


    <div class="form-field">

        <label>
            Место проведения *
        </label>

        <input
            type="text"
            name="place"
            required
        >

    </div>


    <div class="event-submit">

        <button
            type="submit"
            class="primary-button"
        >
            Создать мероприятие
        </button>

    </div>

</form>

</div>

<script>
    (() => {
        const toggle = document.getElementById("eventMultiDay");
        const startDate = document.getElementById("eventStartDate");
        const endDateField = document.getElementById("eventEndDateField");
        const endDate = document.getElementById("eventEndDate");

        const updateEndDate = () => {
            const enabled = toggle.checked;
            endDateField.hidden = !enabled;
            endDate.disabled = !enabled;
            endDate.required = enabled;
            endDate.min = startDate.value;
            if (!enabled) {
                endDate.value = startDate.value;
            } else if (!endDate.value || endDate.value < startDate.value) {
                endDate.value = startDate.value;
            }
        };

        toggle.addEventListener("change", updateEndDate);
        startDate.addEventListener("change", updateEndDate);
        updateEndDate();
    })();
</script>

{% endblock %}
