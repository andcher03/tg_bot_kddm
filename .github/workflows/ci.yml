name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 и PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kddm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kddm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BOT_TOKEN: 0000000000:CI_TEST_TOKEN
      TELEGRAM_CHANNEL_ID: "@ci_test_channel"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kddm_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kddm_test
      DATABASE_STARTUP_ATTEMPTS: 5
      DATABASE_STARTUP_DELAY: 1
      WEB_ADMIN_COOKIE_SECURE: 0

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Создать отдельную тестовую базу
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  host="127.0.0.1",
                  port=5432,
                  user="postgres",
                  password="postgres",
                  database="postgres",
              )
              try:
                  await connection.execute("CREATE DATABASE kddm_test")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Проверить синтаксис и код
        run: |
          python -m compileall -q bot.py mailing_worker.py config.py handlers keyboards middlewares migrations services states tests web_admin
          python -m ruff check .

      - name: Применить миграции рабочей CI-базы
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Применить миграции тестовой базы
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Запустить тесты
        run: python -m pytest -q

  windows:
    name: Совместимость с Windows Server
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      BOT_TOKEN: 0000000000:CI_TEST_TOKEN
      TELEGRAM_CHANNEL_ID: "@ci_test_channel"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kddm_ci
      DATABASE_STARTUP_ATTEMPTS: 1
      WEB_ADMIN_COOKIE_SECURE: 0

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Проверить синтаксис в Windows
        run: python -m compileall -q bot.py mailing_worker.py config.py handlers keyboards middlewares migrations services states tests web_admin

      - name: Проверить код в Windows
        run: python -m ruff check .

      - name: Запустить тесты в Windows
        run: python -m pytest -q

  deploy:
    name: Развернуть на Ubuntu Server
    needs: [tests, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/known_hosts

      - name: Выполнить deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/kddm-deploy '$TARGET_SHA'"
