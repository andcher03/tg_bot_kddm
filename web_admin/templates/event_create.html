{% extends "base.html" %}

{% block title %}
Новое мероприятие — Молодёжь Казани
{% endblock %}


{% block content %}

<a
    href="/events"
    class="back-link"
>
    ← К мероприятиям
</a>


<div class="page-header">

    <div>
        <h1>
            Новое мероприятие
        </h1>

        <p class="subtitle">
            Заполните информацию о мероприятии
        </p>
    </div>

</div>


<div class="event-create-card">

<form
    method="post"
    action="/events/new"
    class="event-form"
>


    <div class="form-field">

        <label>
            Название *
        </label>

        <input
            type="text"
            name="title"
            required
        >

    </div>


    <div class="form-field">

        <label>
            Описание
        </label>

        <textarea
            name="description"
            rows="6"
        ></textarea>

    </div>


    <div class="form-field event-multi-day-toggle">
        <label class="mailing-checkbox">
            <input
                type="checkbox"
                name="is_multi_day"
                id="eventMultiDay"
                value="true"
            >
            <span>Мероприятие длится несколько дней</span>
        </label>
    </div>

    <div class="form-row">

        <div class="form-field">

            <label>
                Дата начала *
            </label>

            <input
                type="date"
                name="event_date"
                id="eventStartDate"
                required
            >

        </div>


        <div class="form-field event-end-date-field" id="eventEndDateField" hidden>

            <label>
                Дата завершения *
            </label>

            <input
                type="date"
                name="end_date"
                id="eventEndDate"
                disabled
            >

        </div>


        <div class="form-field">

            <label>
                Время *
            </label>

            <input
                type="time"
                name="start_time"
                required
            >

        </div>

    </div>


    <div class="form-field">

        <label>
            Место проведения *
        </label>

        <input
            type="text"
            name="place"
            required
        >

    </div>

    <div class="form-field event-multi-day-toggle">
        <label class="mailing-checkbox">
            <input
                type="checkbox"
                name="has_participant_limit"
                id="eventHasParticipantLimit"
                value="true"
            >
            <span>Лимит участников</span>
        </label>
    </div>

    <div class="participant-limit-panel" id="participantLimitField" hidden>
        <div class="participant-limit-info">
            <span class="participant-limit-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="9.5" cy="7" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M17 11a3.5 3.5 0 1 0-1.2-6.8M17 14.5a4 4 0 0 1 4 4V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="participant-limit-copy">
                <label for="eventMaxParticipants">Количество мест *</label>
                <span>Максимальное число участников мероприятия</span>
            </span>
        </div>
        <div class="participant-limit-control">
            <input
                class="participant-limit-input"
                type="number"
                name="max_participants"
                id="eventMaxParticipants"
                min="1"
                step="1"
                inputmode="numeric"
                placeholder="Например, 30"
                disabled
            >
            <span>мест</span>
        </div>
    </div>


    <div class="event-submit">

        <button
            type="submit"
            class="primary-button"
        >
            Создать мероприятие
        </button>

    </div>

</form>

</div>

<script>
    (() => {
        const toggle = document.getElementById("eventMultiDay");
        const startDate = document.getElementById("eventStartDate");
        const endDateField = document.getElementById("eventEndDateField");
        const endDate = document.getElementById("eventEndDate");
        const limitToggle = document.getElementById("eventHasParticipantLimit");
        const limitField = document.getElementById("participantLimitField");
        const maxParticipants = document.getElementById("eventMaxParticipants");

        const updateEndDate = () => {
            const enabled = toggle.checked;
            endDateField.hidden = !enabled;
            endDate.disabled = !enabled;
            endDate.required = enabled;
            endDate.min = startDate.value;
            if (!enabled) {
                endDate.value = startDate.value;
            } else if (!endDate.value || endDate.value < startDate.value) {
                endDate.value = startDate.value;
            }
        };

        toggle.addEventListener("change", updateEndDate);
        startDate.addEventListener("change", updateEndDate);
        updateEndDate();

        const updateParticipantLimit = () => {
            const enabled = limitToggle.checked;
            limitField.hidden = !enabled;
            maxParticipants.disabled = !enabled;
            maxParticipants.required = enabled;
        };
        limitToggle.addEventListener("change", updateParticipantLimit);
        updateParticipantLimit();
    })();
</script>

{% endblock %}
