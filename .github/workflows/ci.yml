name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 и PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kddm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kddm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BOT_TOKEN: 0000000000:CI_TEST_TOKEN
      TELEGRAM_CHANNEL_ID: "@ci_test_channel"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kddm_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kddm_test
      DATABASE_STARTUP_ATTEMPTS: 5
      DATABASE_STARTUP_DELAY: 1
      WEB_ADMIN_COOKIE_SECURE: 0

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Создать отдельную тестовую базу
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  host="127.0.0.1",
                  port=5432,
                  user="postgres",
                  password="postgres",
                  database="postgres",
              )
              try:
                  await connection.execute("CREATE DATABASE kddm_test")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Проверить синтаксис и код
        run: |
          python -m compileall -q .
          ruff check .

      - name: Применить миграции рабочей CI-базы
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Применить миграции тестовой базы
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Запустить тесты
        run: python -m pytest -q

  windows:
    name: Совместимость с Windows Server
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      BOT_TOKEN: 0000000000:CI_TEST_TOKEN
      TELEGRAM_CHANNEL_ID: "@ci_test_channel"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kddm_ci
      DATABASE_STARTUP_ATTEMPTS: 1
      WEB_ADMIN_COOKIE_SECURE: 0

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Проверить Windows-совместимость
        run: |
          python -m compileall -q .
          ruff check .
          python -m pytest -q
